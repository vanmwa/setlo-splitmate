      <path d="M0 0h78" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 0l12-6v12z" fill="#475569"/>
      <path d="M66 0l14-10h10l-12 10 12 10h-10z" fill="#facc15"/>
