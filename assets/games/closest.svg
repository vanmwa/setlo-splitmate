<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5d0fe"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="30" cy="170" r="5" fill="#fde047"/><circle cx="296" cy="28" r="5" fill="#fff" opacity=".8"/><circle cx="160" cy="20" r="3" fill="#d946ef" opacity=".5"/>
  <!-- the target line: don't go over -->
