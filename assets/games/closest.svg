    <circle cx="-14" cy="-12" r="10" fill="#f97316"/><circle cx="6" cy="-14" r="9" fill="#22c55e"/><rect x="12" y="-26" width="12" height="20" rx="3" fill="#facc15"/>
    <path d="M-40 -8h80l-10 52h-60z" fill="#d946ef"/>
